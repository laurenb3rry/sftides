<!doctype html>
<meta charset="utf-8">
<title>Currents on the tide graph — options</title>
<style>
  :root { --paper:#F4F1E8; --ink:#16161A; --mute:#7B7870; --spot:#1A3A8F; }
  body { background:#e9e5d8; margin:0; padding:24px; font:12px ui-monospace,Menlo,monospace; color:var(--ink); }
  h1 { font-size:13px; letter-spacing:.12em; margin:0 0 16px; }
  .row { display:flex; gap:20px; flex-wrap:wrap; }
  figure { margin:0; background:var(--paper); width:390px; padding:0 0 4px; }
  figcaption { padding:10px 26px; font-size:9px; letter-spacing:.1em; color:var(--mute); border-top:1px solid rgba(22,22,26,.13); }
  figcaption b { color:var(--ink); }
  svg { display:block; }
  text { font-family:ui-monospace,Menlo,monospace; }
</style>
<h1>CURRENTS — ROUND 2, NO BLUE (BLUE = SLACK + SWIM ARROWS)</h1>
<div class="row" id="row"></div>
<script>
const W=390,H=262,X0=26,X1=364,TOP=28,BASE=202,AMP=BASE-TOP;
const px=t=>X0+(X1-X0)*t/24;
const h=t=>Math.cos(2*Math.PI*(t-10.9)/12.4)+0.28*Math.cos(2*Math.PI*(t-10.9)/24.8)+0.1;
const hs=[...Array(241)].map((_,i)=>h(i/10)),lo=Math.min(...hs),hi=Math.max(...hs),pad=(hi-lo)*.08;
const py=t=>BASE-((h(t)-lo+pad)/(hi-lo+2*pad))*(AMP-0);
const pts=(a,b)=>{let s=[];for(let t=a;t<=b+1e-9;t+=.1)s.push([px(t),py(t)]);return s};
const line=(a,b)=>pts(a,b).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
const area=(a,b)=>line(a,b)+`L${px(b)} ${BASE}L${px(a)} ${BASE}Z`;
// flood/ebb periods read off the screenshot
const P=[[0,5+40/60,0],[5+40/60,11+55/60,1],[11+55/60,18+20/60,0],[18+20/60,24,1]];
const span=['12:00AM–5:40AM','5:40AM–11:55AM','11:55AM–6:20PM','6:20PM–12:15AM'];
const SLACKS=[[5.23,6.05],[11.6,12.28],[17.92,18.72]];
const tick=['12AM','6AM','12PM','6PM','12AM'];
const base=(extra='')=>`
 <defs>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#1A3A8F" opacity=".15"/></pattern>
  <pattern id="dotsI" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#16161A" opacity=".5"/></pattern>
  <pattern id="dotsB" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#1A3A8F" opacity=".5"/></pattern>
  <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#16161A" stroke-width=".9" opacity=".55"/></pattern>
  <pattern id="dotsR" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#A8483A" opacity=".45"/></pattern>
  <pattern id="dotsG" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#4B7A5B" opacity=".45"/></pattern>
   <pattern id="hatchF" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#16161A" stroke-width=".9" opacity=".5"/></pattern>
  <pattern id="hatchE" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#16161A" stroke-width=".9" opacity=".5"/></pattern>
  <pattern id="hLines" width="4" height="4" patternUnits="userSpaceOnUse"><line x1="0" y1="2" x2="4" y2="2" stroke="#16161A" stroke-width=".8" opacity=".45"/></pattern>
  <pattern id="dotsK" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#16161A" opacity=".55"/></pattern>
  <pattern id="hatchR" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#A8483A" stroke-width=".9" opacity=".65"/></pattern>
  <pattern id="hatchG" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#4B7A5B" stroke-width=".9" opacity=".7"/></pattern>
 </defs>
 <line x1="${X0}" x2="${X1}" y1="${TOP+(BASE-TOP)/3}" y2="${TOP+(BASE-TOP)/3}" stroke="#16161A" stroke-opacity=".14" stroke-width=".6"/>
 <line x1="${X0}" x2="${X1}" y1="${TOP+2*(BASE-TOP)/3}" y2="${TOP+2*(BASE-TOP)/3}" stroke="#16161A" stroke-opacity=".14" stroke-width=".6"/>
 ${extra}`;
const frame=(fills,over,toggles)=>`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
 ${base(fills)}
 <path d="${line(0,24)}" fill="none" stroke="#16161A" stroke-width="1.7"/>
 ${over}
 <line x1="${X0}" x2="${X1}" y1="${BASE}" y2="${BASE}" stroke="#16161A" stroke-width="1.2"/>
 ${tick.map((t,i)=>`<line x1="${px(i*6)}" x2="${px(i*6)}" y1="${BASE}" y2="${BASE+4}" stroke="#16161A"/><text x="${px(i*6)}" y="${BASE+16}" font-size="7" letter-spacing="1.4" fill="#7B7870" text-anchor="middle">${t}</text>`).join('')}
 ${toggles}
</svg>`;
const box=(x,on,label)=>`<g transform="translate(${x},${BASE+30})"><rect x=".5" y="-4.5" width="10" height="10" rx="1" fill="${on?'#16161A':'none'}" stroke="#16161A"/>${on?'<path d="M2.6 .6l2.2 2.2 3.6-4.2" stroke="#F4F1E8" stroke-width="1.4" fill="none"/>':''}<text x="17" y="3.5" font-size="7.6" letter-spacing="1.3" fill="${on?'#16161A':'#7B7870'}">${label}</text></g>`;
const toggles=(s,c)=>box(X0,s,'SLACK')+box(X0+86,c,'CURRENTS');
const lab=(i,c1,c2,mid)=>{ // fixed height off the axis, hidden when it would touch the curve
  const [a,b,f]=P[i]; if(i==0) return '';
  const m=(px(a)+px(b))/2; return `<text x="${m}" y="${BASE-26}" font-size="8" font-weight="600" letter-spacing="1.4" fill="${f?c1:c2}" text-anchor="middle">${f?'FLOOD':'EBB'}</text>
  <text x="${m}" y="${BASE-14}" font-size="7" fill="${f?c1:c2}" text-anchor="middle">${span[i]}</text>`};
const cross=()=>[P[1][0],P[2][0],P[3][0]].map(t=>`<line x1="${px(t)}" x2="${px(t)}" y1="${py(t)}" y2="${BASE}" stroke="#16161A" stroke-opacity=".35" stroke-width=".6" stroke-dasharray="1.5 2"/>`).join('');
const slackLabels=SLACKS.map(([a,b])=>`<text x="${px(a)+3}" y="13" font-size="7" fill="#1A3A8F">SLACK</text>`).join('');
const slack=SLACKS.map(([a,b])=>`<rect x="${px(a)}" y="4" width="${px(b)-px(a)}" height="${BASE-4}" fill="#1A3A8F" opacity=".14"/>`).join('');
const V=[];
const nb=(f)=>P.map(([a,b,fl])=>`<path d="${area(a,b)}" fill="url(#${f(fl)})"/>`).join('');
const K='#16161A',M='#7B7870';
const L=(c1,c2)=>lab(1,c1,c2)+lab(2,c1,c2)+lab(3,c1,c2);
V.push(['REFERENCE · slack on, currents off','what slack and the swim arrows look like now (blue)',frame(slack+`<path d="${area(0,24)}" fill="url(#dots)"/>`,slackLabels,toggles(true,false))]);
V.push(['1 · INK HATCH / INK DOTS','all ink. flood = diagonal hatching, ebb = dots.',frame(slack+nb(f=>f?'hatchF':'dotsK'),cross()+slackLabels+L(K,K),toggles(true,true))]);
V.push(['2 · OPPOSING HATCH','all ink. flood hatches up-right (/), ebb hatches the other way (\\). Same line weight, so neither shouts; the direction is the legend.',frame(slack+nb(f=>f?'hatchF':'hatchE'),cross()+slackLabels+L(K,K),toggles(true,true))]);
V.push(['3 · HATCH / WATER LINES','all ink. flood = diagonal hatch, ebb = flat horizontal lines (water settling back). Quietest of the set.',frame(slack+nb(f=>f?'hatchF':'hLines'),cross()+slackLabels+L(K,M),toggles(true,true))]);
V.push(['4 · TEXTURE + RED / GREEN LINES','B\'s textures, but the hatch is drawn in terracotta and sage instead of ink; no fills, no blue. Labels take the same hues.',frame(slack+nb(f=>f?'hatchR':'hatchG'),cross()+slackLabels+L('#8A3326','#35603F'),toggles(true,true))]);
document.getElementById('row').innerHTML=V.map(([t,d,s])=>`<figure>${s}<figcaption><b>${t}</b>${d?'<br>'+d:''}</figcaption></figure>`).join('');
</script>
